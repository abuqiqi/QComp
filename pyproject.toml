[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tn-compression"
version = "0.2.0"
description = "Backend-neutral TT-matrix compression, fine-tuning, and evaluation for causal language models"
requires-python = ">=3.11"
dependencies = [
  "datasets==3.6.0",
  "lm-eval==0.4.12",
  "safetensors>=0.4.3",
  "torch==2.5.1",
  "transformers==4.51.3",
]

[project.optional-dependencies]
tensorly = ["tensorly==0.8.1", "tensorly-torch==0.5.0"]
torchtt = ["torchTT==0.4.0"]
cutensornet = ["cuquantum-python-cu12>=25.6"]

[project.scripts]
qwen3-tn-decompose = "qwen3_tn.cli.decompose:main"
qwen3-tn-finetune = "qwen3_tn.cli.finetune:main"
qwen3-tn-evaluate = "qwen3_tn.cli.evaluate:main"
qwen3-tn-sweep = "qwen3_tn.cli.sweep:main"
qwen3-tn-benchmark = "qwen3_tn.cli.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
