[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcomp"
version = "0.1.0"
description = "Tensor-network compression backends for PyTorch models"
requires-python = ">=3.11"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.8"]
tensorly = [
  "tensorly==0.8.1",
  "tensorly-torch==0.5.0",
]
torchtt = ["torchTT==0.4.0"]
cutensornet = ["cuquantum-python-cu12>=25.6"]
all = [
  "matplotlib>=3.8",
  "tensorly==0.8.1",
  "tensorly-torch==0.5.0",
  "torchTT==0.4.0",
  "cuquantum-python-cu12>=25.6",
]

[tool.setuptools.packages.find]
where = ["src"]

